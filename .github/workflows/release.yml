name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  queue: max

env:
  CGO_ENABLED: '0'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test release version increments
        if: runner.os == 'Linux'
        run: bash .github/scripts/next-release-version.test.sh
      - name: Generate Templ views
        run: go generate ./web/views
      - name: Verify generated views
        run: git diff --exit-code -- web/views
      - name: Test browser-side modules
        run: node --test web/test/*.test.mjs
      - name: Verify dependencies
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 -timeout=10m ./...

  build:
    name: Package binaries
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Resolve next release version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(
            gh api --paginate 'repos/{owner}/{repo}/tags?per_page=100' --jq '.[].name' |
              bash .github/scripts/next-release-version.sh "$BUMP"
          )
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build and package six targets
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            target_os="${target%/*}"
            target_arch="${target#*/}"
            package="otoha_${RELEASE_VERSION}_${target_os}_${target_arch}"
            staging="$RUNNER_TEMP/$package"
            mkdir -p "$staging"
            binary=otoha
            if [[ "$target_os" == windows ]]; then binary=otoha.exe; fi
            GOOS="$target_os" GOARCH="$target_arch" go build -mod=readonly -trimpath \
              -ldflags "-s -w -X github.com/SiIverAsh/otoha/cmd.Version=$RELEASE_VERSION" \
              -o "$staging/$binary" .
            cp README.md LICENSE "$staging/"
            cp -R deploy "$staging/"
            if [[ "$target_os" == linux && "$target_arch" == amd64 ]]; then
              "$staging/$binary" --version | grep -Fx "otoha $RELEASE_VERSION"
              "$staging/$binary" --help
            fi
            if [[ "$target_os" == windows ]]; then
              (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/dist/$package.zip" "$package")
            else
              tar -C "$RUNNER_TEMP" -czf "dist/$package.tar.gz" "$package"
            fi
          done
          (cd dist && sha256sum -- *.tar.gz *.zip > checksums.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: Verify checksums and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check checksums.txt)
          gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" \
            --title "Otoha $RELEASE_TAG" --generate-notes
