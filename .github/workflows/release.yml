name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: '0'

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build embedded frontend
        run: node web/build.mjs
      - name: Verify dependencies
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 -timeout=10m ./...

  build:
    name: Package binaries
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build embedded frontend
        run: node web/build.mjs
      - name: Build and package six targets
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="dev-${GITHUB_SHA:0:7}"
          if [[ "$REF_TYPE" == tag ]]; then
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Expected a release tag such as v0.1.0 or v0.1.0-rc.1" >&2
              exit 1
            fi
            version="${REF_NAME#v}"
          fi
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            target_os="${target%/*}"
            target_arch="${target#*/}"
            package="otoha_${version}_${target_os}_${target_arch}"
            staging="$RUNNER_TEMP/$package"
            mkdir -p "$staging"
            binary=otoha
            if [[ "$target_os" == windows ]]; then binary=otoha.exe; fi
            GOOS="$target_os" GOARCH="$target_arch" go build -mod=readonly -trimpath \
              -ldflags "-s -w -X github.com/SiIverAsh/otoha/cmd.Version=$version" \
              -o "$staging/$binary" .
            cp README.md LICENSE "$staging/"
            cp -R deploy "$staging/"
            if [[ "$target_os" == linux && "$target_arch" == amd64 ]]; then
              "$staging/$binary" --version | grep -Fx "otoha $version"
              "$staging/$binary" --help
            fi
            if [[ "$target_os" == windows ]]; then
              (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/dist/$package.zip" "$package")
            else
              tar -C "$RUNNER_TEMP" -czf "dist/$package.tar.gz" "$package"
            fi
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: Verify checksums and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check checksums.txt)
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes \
              --title "Otoha $RELEASE_TAG" "${flags[@]}"
          fi
